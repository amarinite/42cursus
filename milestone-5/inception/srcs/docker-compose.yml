services:
  mariadb:
    build: requirements/mariadb
    container_name: mariadb
    image: mariadb
    volumes:
      - db-data:/var/lib/mysql
    secrets:
      - mysql_root_password
      - mysql_password
    networks:
      - inception
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?required}
      MYSQL_USER: ${MYSQL_USER:?required}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_CHARSET: ${MYSQL_CHARSET:-utf8mb4}
      MYSQL_COLLATION: ${MYSQL_COLLATION:-utf8mb4_unicode_ci}
    restart: unless-stopped
  
  wordpress:
    build: requirements/wordpress
    container_name: wordpress
    image: wordpress
    depends_on:
      - mariadb
    volumes:
      - wp-data:/var/www/html
    secrets:
      - mysql_password
      - wp_admin_password
      - wp_user_password
    networks:
      - inception
    environment:
      MYSQL_HOST: ${MYSQL_HOST:?required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?required}
      MYSQL_USER: ${MYSQL_USER:?required}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      WP_URL: ${WP_URL:?required}
      WP_TITLE: ${WP_TITLE:?required} 
      WP_ADMIN_USER: ${WP_ADMIN_USER:?required} 
      WP_ADMIN_PASSWORD_FILE: /run/secrets/wp_admin_password
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:?required} 
      WP_USER_NAME: ${WP_USER_NAME:?required} 
      WP_USER_EMAIL: ${WP_USER_EMAIL:?required} 
      WP_USER_PASSWORD_FILE: /run/secrets/wp_user_password
    restart:
      unless-stopped

  nginx:
    build: requirements/nginx
    container_name: nginx
    image: nginx
    depends_on:
      - wordpress
    volumes:
      - wp-data:/var/www/html
    networks:
      - inception
    ports:
      - "443:443"
    restart:
      unless-stopped

  redis:
    build: requirements/bonus/redis
    container_name: redis
    image: redis
    networks:
      - inception
    restart:
      unless-stopped

  static-site:
    build: requirements/bonus/static-site
    container_name: static-site
    image: static-site
    networks:
      - inception
    ports:
      - "80:80"
    restart: unless-stopped
  
  adminer:
    build: requirements/bonus/adminer
    container_name: adminer
    image: adminer
    depends_on:
      - mariadb
    networks:
      - inception
    ports:
      - "8080:8080"
    stop_grace_period: 1s
    restart: unless-stopped

  glances:
    build: requirements/bonus/glances
    container_name: glances
    image: glances
    ports:
      - "61208:61208"
    networks:
      - inception
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  ftp:
    build: requirements/bonus/ftp
    container_name: ftp
    image: ftp
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    volumes:
      - wp-data:/var/www/html
    secrets:
      - ftp_password
    networks:
      - inception
    environment:
      FTP_USER: ${FTP_USER:?required}
      FTP_PASSWORD_FILE: /run/secrets/ftp_password
    stop_grace_period: 1s
    restart: unless-stopped

secrets:
  mysql_root_password:
    file: ../secrets/mysql_root_password.txt
  mysql_password:
    file: ../secrets/mysql_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt

volumes:
  db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/amarquez/data/mariadb
  wp-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/amarquez/data/wordpress


networks:
  inception:
    driver: bridge
