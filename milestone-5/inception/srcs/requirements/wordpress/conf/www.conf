[www]
; how PHP runs and serves PHP requests

; 1) define which user runs PHP-FPM processes:
user = nobody
group = nobody

; 2) listening method (how PHP-FPM is exposed):
listen = 0.0.0.0:9000
; (nginx connects via wordpress:9000)

; 3) process manager settings (for small projects, defaults are fine)
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; 4) timeout/stability
request_terminate_timeout = 60s
; (prevents stuck PHP scripts)

; 5) security limits:
security.limit_extensions = .php
; (prevents execution of non-PHP files)

; 6) allow PHP to access environment variables
clear_env = no
